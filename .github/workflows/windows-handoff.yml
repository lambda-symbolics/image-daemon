name: Windows handoff
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      LISP: sbcl-bin/2.6.6
      MSYSCON: Stop-Roswell-From-Installing-Msys2
    steps:
      - uses: actions/checkout@v5
      - name: Refresh MSYS2 package databases
        uses: msys2/setup-msys2@cc11e9188b693c2b100158c3322424c4cc1dadea # v2.22.0
        with:
          update: true
          cache: false
          path-type: inherit
          install: make mingw-w64-x86_64-roswell
      - name: Install native SBCL and locked dependencies
        shell: msys2 {0}
        run: |
          set -eo pipefail
          ros install "$LISP"
          ros use "$LISP"
          ros install fukamachi/qlot
          export PATH="$HOME/.roswell/bin:$HOME/.roswell/lisp/quicklisp/bin:$PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/lisp/quicklisp/bin" >> "$GITHUB_PATH"
          qlot install --no-deps
      - name: Native Windows handoff cases
        shell: msys2 {0}
        run: |
          qlot exec ros run -- --noinform --non-interactive \
            --load .qlot/setup.lisp \
            --eval '(require :asdf)' \
            --eval '(assert (and (member :win32 *features*) (member :x86-64 *features*)))' \
            --eval '(asdf:load-asd (merge-pathnames "image-daemon.asd" (uiop:getcwd)))' \
            --eval '(asdf:test-system "image-daemon/windows-handoff-tests")'
